repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff --config dev/ruff.toml check ccbt/ --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        files: ^ccbt/.*\.py$
        exclude: ^(tests/|benchmarks/|ccbt/i18n/scripts/|ccbt/i18n/locale_data/|.*/__pycache__/|.*\.pyc$|.*\.pyo$|dev/|dist/|docs/|htmlcov/|site/|\.benchmarks/|\.ccbt/|\.cursor/|\.github/|\.hypothesis/|\.pre-commit-cache/|\.pre-commit-home/|\.pytest_cache/|\.ruff_cache/|\.venv/)
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff --config dev/ruff.toml format ccbt/
        language: system
        types: [python]
        files: ^ccbt/.*\.py$
        exclude: ^(tests/|benchmarks/|ccbt/i18n/scripts/|ccbt/i18n/locale_data/|.*/__pycache__/|.*\.pyc$|.*\.pyo$|dev/|dist/|docs/|htmlcov/|site/|\.benchmarks/|\.ccbt/|\.cursor/|\.github/|\.hypothesis/|\.pre-commit-cache/|\.pre-commit-home/|\.pytest_cache/|\.ruff_cache/|\.venv/)
        pass_filenames: false
      - id: compatibility-linter
        name: compatibility-linter
        entry: uv run python dev/compatibility_linter.py ccbt/
        language: system
        types: [python]
        files: ^ccbt/.*\.py$
        exclude: ^(tests/|benchmarks/|ccbt/i18n/scripts/|ccbt/i18n/locale_data/|.*/__pycache__/|.*\.pyc$|.*\.pyo$|dev/|dist/|docs/|htmlcov/|site/|\.benchmarks/|\.ccbt/|\.cursor/|\.github/|\.hypothesis/|\.pre-commit-cache/|\.pre-commit-home/|\.pytest_cache/|\.ruff_cache/|\.venv/)
        pass_filenames: false
      - id: ty
        name: ty
        entry: uv run ty check --config-file=dev/ty.toml --output-format=concise
        language: system
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run python tests/scripts/ensure_bandit_dir.py
        language: system
        pass_filenames: false
      - id: pytest-fast
        name: pytest-fast
        entry: uv run python tests/scripts/run_pytest_selective.py --coverage --full-suite
        language: system
        types: [python]
        files: ^ccbt/.*\.py$
        exclude: ^(tests/|benchmarks/|ccbt/i18n/scripts/|ccbt/i18n/locale_data/|.*/__pycache__/|.*\.pyc$|.*\.pyo$|dev/|dist/|docs/|htmlcov/|site/|\.benchmarks/|\.ccbt/|\.cursor/|\.github/|\.hypothesis/|\.pre-commit-cache/|\.pre-commit-home/|\.pytest_cache/|\.ruff_cache/|\.venv/)
        pass_filenames: true
        stages: [pre-commit]
      - id: pytest-coverage
        name: pytest-coverage
        entry: uv run python tests/scripts/run_pytest_selective.py --coverage --full-suite
        language: system
        types: [python]
        files: ^ccbt/.*\.py$
        exclude: ^(tests/|benchmarks/|ccbt/i18n/scripts/|ccbt/i18n/locale_data/|.*/__pycache__/|.*\.pyc$|.*\.pyo$|dev/|dist/|docs/|htmlcov/|site/|\.benchmarks/|\.ccbt/|\.cursor/|\.github/|\.hypothesis/|\.pre-commit-cache/|\.pre-commit-home/|\.pytest_cache/|\.ruff_cache/|\.venv/)
        pass_filenames: true
        stages: [pre-push]
      - id: codecov-upload
        name: codecov-upload
        entry: uv run python tests/scripts/upload_coverage.py --file site/reports/coverage.xml --flags unittests
        language: system
        types: [python]
        files: ^ccbt/.*\.py$
        exclude: ^(tests/|benchmarks/|ccbt/i18n/scripts/|ccbt/i18n/locale_data/|.*/__pycache__/|.*\.pyc$|.*\.pyo$|dev/|dist/|docs/|htmlcov/|site/|\.benchmarks/|\.ccbt/|\.cursor/|\.github/|\.hypothesis/|\.pre-commit-cache/|\.pre-commit-home/|\.pytest_cache/|\.ruff_cache/|\.venv/)
        pass_filenames: false
        stages: [pre-push]
        require_serial: true
      - id: mkdocs-build
        name: mkdocs-build
        entry: uv run python dev/build_docs_patched_clean.py
        language: system
        types: [markdown]
        files: ^(docs/.*\.md|docs/blog/.*\.md|README\.md|dev/mkdocs\.yml)$
        pass_filenames: false
        stages: [manual]
      - id: check-translations
        name: check-translations
        entry: uv run python -m ccbt.i18n.scripts.check_string_coverage --source-dir ccbt
        language: system
        types: [python]
        files: ^ccbt/cli/.*\.py$
        pass_filenames: false
        stages: [pre-commit]
      - id: validate-po
        name: validate-po
        entry: uv run python -m ccbt.i18n.scripts.validate_po
        language: system
        types: [text]
        files: ^ccbt/i18n/locales/.*/LC_MESSAGES/.*\.po$
        pass_filenames: false
        stages: [pre-commit]
      - id: validate-version
        name: validate-version
        entry: uv run python dev/scripts/validate_version.py
        language: system
        types: [python]
        files: ^(pyproject\.toml|ccbt/__init__\.py)$
        pass_filenames: false
        stages: [pre-commit]
      - id: validate-changelog
        name: validate-changelog
        entry: uv run python dev/scripts/validate_changelog.py
        language: system
        types: [python]
        files: ^(ccbt/.*\.py|tests/.*\.py|dev/.*\.py)$
        pass_filenames: false
        stages: [pre-commit]


