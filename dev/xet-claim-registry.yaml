    gate: G5
    test_ids: [test_interop_hf_xet_against_ccbt_cas, test_interop_hub_huggingface_hub]
  - id: C20
    claim: "No placeholder XET modules remain reachable from docs"
    status: experimental
    owner_module: ccbt/storage
    gate: G2
    test_ids: [test_xet_no_placeholder_modules]
