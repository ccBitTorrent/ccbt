name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.8, 3.9, 3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Lint with pre-commit
      run: |
        uv run pre-commit run --all-files -c dev/pre-commit-config.yaml
    
    - name: Validate changelog
      run: |
        uv run python dev/scripts/validate_changelog.py || {
          echo "⚠️  Changelog validation failed. This is a warning for CI."
          echo "Please ensure dev/CHANGELOG.md is updated with your changes."
          exit 0  # Don't fail CI, just warn
        }

    - name: Test with pytest
      run: |
        uv run pytest -c dev/pytest.ini tests/ -v --cov=ccbt --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit security scan
      run: bandit -r ccbt/ -f json -o bandit-report.json

    - name: Run safety check
      run: safety check

  performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Run performance benchmarks
      run: |
        uv run python benchmarks/bench_throughput.py
        uv run python benchmarks/bench_disk.py
        uv run python benchmarks/bench_hash_verification.py

  docs:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      contains(github.event.pull_request.changed_files, 'docs/') ||
      contains(github.event.pull_request.changed_files, 'dev/mkdocs.yml') ||
      contains(github.event.pull_request.changed_files, 'ccbt/i18n/')
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install UV
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Build documentation
      run: |
        # Use the patched build script which includes all necessary patches:
        # - i18n plugin fixes (alternates attribute, Locale validation for 'arc')
        # - git-revision-date-localized plugin fix for 'arc' locale
        # - All patches are applied before mkdocs is imported
        # Set MKDOCS_STRICT=true to enable strict mode in CI
        MKDOCS_STRICT=true uv run python dev/build_docs_patched_clean.py

    - name: Validate translations
      run: |
        uv run python -m ccbt.i18n.scripts.validate_po

    - name: Upload docs artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: docs-build-failure
        path: site/

  build:
    runs-on: ${{ matrix.os }}
    needs: [test, security]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.os }}
        path: dist/
